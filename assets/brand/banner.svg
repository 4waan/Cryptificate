<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="title desc">
  <title id="title">How Cryptificate works</title>
  <desc id="desc">Your change to a matrix, circuit, row offsets, S-box or prime-field layer goes to Lean-checked claims (circuit equivalence, MDS, row offsets, activity bound), then to native Rust measurements, and ends in a replayable evidence bundle.</desc>
  <style>
    text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .ttl{font-size:15px;font-weight:600;fill:#13213A}
    .sub{font-size:13.5px;fill:#4A566D}
    .card{fill:#F6F8FA;stroke:#D0D7DE}
    .arrow{fill:none;stroke:#8C959F;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .a{fill:#E4572E}.c{fill:#13213A}.t{fill:#BEC6D3}
    @media (prefers-color-scheme:dark){
      .ttl{fill:#E8ECF2}.sub{fill:#A3AEC0}
      .card{fill:#161B22;stroke:#30363D}
      .a{fill:#F26A45}.c{fill:#E8ECF2}.t{fill:#3B4760}
    }
  </style>
  <g>
    <rect class="card" x="0.5" y="18.5" width="203" height="182" rx="6"/>
