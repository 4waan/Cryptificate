  <g>
    <rect class="card" x="696.5" y="18.5" width="203" height="182" rx="6"/>
    <rect class="c" x="716" y="40" width="12" height="12" rx="0.75"/><rect class="c" x="732" y="40" width="12" height="12" rx="0.75"/><rect class="c" x="748" y="40" width="12" height="12" rx="0.75"/><rect class="c" x="764" y="40" width="12" height="12" rx="0.75"/><rect class="c" x="716" y="56" width="12" height="12" rx="0.75"/><rect class="c" x="732" y="56" width="12" height="12" rx="0.75"/><rect class="c" x="748" y="56" width="12" height="12" rx="0.75"/><rect class="c" x="764" y="56" width="12" height="12" rx="0.75"/><rect class="c" x="716" y="72" width="12" height="12" rx="0.75"/><rect class="c" x="732" y="72" width="12" height="12" rx="0.75"/><rect class="c" x="748" y="72" width="12" height="12" rx="0.75"/><rect class="c" x="764" y="72" width="12" height="12" rx="0.75"/><rect class="c" x="716" y="88" width="12" height="12" rx="0.75"/><rect class="c" x="732" y="88" width="12" height="12" rx="0.75"/><rect class="c" x="748" y="88" width="12" height="12" rx="0.75"/><rect class="c" x="764" y="88" width="12" height="12" rx="0.75"/>
