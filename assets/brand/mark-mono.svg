<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cryptificate">
  <title>Cryptificate</title>
  <!-- Single ink on screen: inherits currentColor; active byte 100 %, column 55 %, state 18 % -->
  <g fill="currentColor">
    <rect x="2" y="2" width="12" height="12" rx="0.75" fill-opacity="1"/>
    <rect x="18" y="2" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="34" y="2" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="50" y="2" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="2" y="18" width="12" height="12" rx="0.75" fill-opacity="0.55"/>
    <rect x="18" y="18" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="34" y="18" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="50" y="18" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="2" y="34" width="12" height="12" rx="0.75" fill-opacity="0.55"/>
    <rect x="18" y="34" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="34" y="34" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="50" y="34" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="2" y="50" width="12" height="12" rx="0.75" fill-opacity="0.55"/>
    <rect x="18" y="50" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="34" y="50" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
    <rect x="50" y="50" width="12" height="12" rx="0.75" fill-opacity="0.18"/>
  </g>
</svg>
