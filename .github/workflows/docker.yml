name: docker

# Builds the container image, runs the smoke tests of scripts/docker-smoke.py
# inside it, and on a version tag pushes the tested image to
# ghcr.io/4waan/cryptificate.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - scripts/docker-smoke.py
      - lean/**
      - crates/**
      - apps/**
      - packages/**
      - assets/brand/**
      - package.json
      - package-lock.json
      - Cargo.toml
      - Cargo.lock
      - refinement/extract.sha256
      - examples/designs/**
      - examples/programs/**
      - examples/bundles/**
      - python/cryptificate/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - scripts/docker-smoke.py
      - lean/**
      - crates/**
      - apps/**
      - packages/**
      - assets/brand/**
      - package.json
      - package-lock.json
      - Cargo.toml
      - Cargo.lock
      - refinement/extract.sha256
      - examples/designs/**
      - examples/programs/**
      - examples/bundles/**
      - python/cryptificate/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/4waan/cryptificate

jobs:
  image:
    name: Build, smoke-test and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe --tags` names the checker revision recorded in reports.
          fetch-depth: 0

      # The image holds the Lean toolchain and Mathlib's compiled library
      # (about 10 GB unpacked); the build stage, the image and its loaded copy
      # do not fit next to the runner's preinstalled SDKs.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune --all --force
          df -h /

      - name: Version and revision
        id: version
        run: |
          echo "version=$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "revision=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cryptificate:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRYPTIFICATE_VERSION=${{ steps.version.outputs.version }}
            CRYPTIFICATE_REVISION=${{ steps.version.outputs.revision }}
          cache-from: type=gha
          # mode=min caches the image's own layers only; the build stages
          # (a second copy of Mathlib) would crowd the Actions cache.
          cache-to: type=gha,mode=min

      - name: Image size
        run: docker image ls cryptificate:ci

      - name: Smoke tests inside the container
        run: python3 scripts/docker-smoke.py cryptificate:ci

      - name: Log in to the GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the image the smoke tests ran against, under every tag the
      # metadata step computed (version, major.minor, sha, latest).
      - name: Push the tested image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag cryptificate:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"
