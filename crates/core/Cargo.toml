[package]
name = "cryptificate-core"
description = "Field arithmetic, public request and report types, validation and canonical encodings for Cryptificate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cryptificate-kernels = { path = "../kernels" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "2"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"
