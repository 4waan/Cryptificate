name = "CryptificateRefinement"
version = "0.1.0"
keywords = ["rust", "refinement", "cryptography"]
defaultTargets = ["Extracted", "Refinement"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib is required first so that its pin (v4.35.0, the one the Aeneas Lean
# library is built against) also wins over the v4.33.1 pin in WideTrail's own
# lakefile.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "74aabd52f77001cf9eaad51b4f4b867a7dc6b111"
subDir = "backends/lean"

[[require]]
name = "WideTrail"
git = "https://github.com/4waan/Wide-Trail-formal-verification"
rev = "162c0f8a9e59841032ec5d66874fee31cf3b6298"

# Lean translations of the recorded Rust sources, produced by Aeneas (see extract.sh).
[[lean_lib]]
name = "Extracted"
roots = ["Extracted.CryptificateKernels", "Extracted.Gf256Aes"]

# The execution model of the main Lean package (`lean/Cryptificate/Bridge.lean`), compiled
# here from the same source files so that the AES-like refinement is stated against those
# definitions rather than a copy of them. The per-design checks of the main package (canonical
# minors, offsets, byte tables and the FIPS 197 S-box table) are compiled the same way, so that
# `Refinement.AesConcrete` can discharge the design hypotheses for concrete byte arrays.
[[lean_lib]]
name = "CryptificateBridge"
srcDir = "../lean"
roots = ["Cryptificate.Bridge", "Cryptificate.Diffusion.Activity", "Cryptificate.Encoding",
  "Cryptificate.Sbox", "Cryptificate.Diffusion.Minors4", "Cryptificate.Diffusion.Offsets"]

# Refinement proofs relating the generated code to the WideTrail specification.
[[lean_lib]]
name = "Refinement"
